# ## version 2
services:
  fbreelz:
    build: .
    container_name: fbreelz
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    environment:
      - TZ=${TZ:-Europe/London}
      - FBREELZ_DATA_DIR=/app/data
      - FBREELZ_COOKIES=/app/secrets/cookies.txt
      - FBREELZ_HTTP_BASE=${FBREELZ_HTTP_BASE:-}
      - FBREELZ_UA=${FBREELZ_UA:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, playwright; assert os.access('/app/data', os.W_OK)"]
      interval: 5m
      timeout: 10s
