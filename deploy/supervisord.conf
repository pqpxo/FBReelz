[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:backend]
command=node /app/backend/server-wrapper.js
directory=/app/backend
autostart=true
autorestart=true
stdout_logfile=/app/data/backend.log
stderr_logfile=/app/data/backend-error.log
environment=NODE_ENV="production",FBREELZ_DATA_DIR="/app/data",FBREELZ_COOKIES="/app/secrets/cookies.txt",VIDEO_DIR="/app/data/cache",WATCHED_FILE="/app/data/watched.json",SCRIPTS_DIR="/app/scripts",WEB_DIR="/app/web"

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock
